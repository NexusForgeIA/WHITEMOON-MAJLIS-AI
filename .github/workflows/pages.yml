# Publica web-taller/ en GitHub Pages (sitio estático, sin build).
# URL: https://nexusforgeia.github.io/WHITEMOON-MAJLIS-AI/
name: Deploy web-taller to Pages

on:
  push:
    branches: [main]
    paths: ["web-taller/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web-taller
      - id: deployment
        uses: actions/deploy-pages@v4
